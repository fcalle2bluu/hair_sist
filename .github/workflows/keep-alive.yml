# Visita el servidor cada 10 minutos para que Render (plan gratis) no lo apague.
# Render lo suspende tras 15 minutos sin tráfico.
name: Mantener servidor despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping a /health
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 15 https://hair-sist.onrender.com/health
