services:
  db:
    image: postgres:16-alpine
    container_name: hair_sist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hair
      POSTGRES_PASSWORD: hair
      POSTGRES_DB: hair_sist
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hair -d hair_sist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
